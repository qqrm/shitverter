[package]
name = "converter-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "macros", "rustls-native-roots"] }
log = "0.4"
pretty_env_logger = "0.5"
tokio = { version = "1.8", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls-native-roots"] }
anyhow = "1.0"

[profile.release]
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
panic = 'abort'     # Abort on panic
