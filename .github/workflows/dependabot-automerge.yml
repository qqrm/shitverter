name: Dependabot Automerge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] metadata-only; never checks out or runs PR code
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-automerge
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Merge green Dependabot pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          collect_prs() {
            if [ "$EVENT_NAME" = "pull_request_target" ]; then
              jq -r '.pull_request.number' "$EVENT_PATH"
            else
              gh pr list \
                --repo "$REPO" \
                --state open \
                --limit 100 \
                --json number,author,headRefName \
                --jq '.[] | select((.author.login == "app/dependabot" or .author.login == "dependabot[bot]") and (.headRefName | startswith("dependabot/"))) | .number'
            fi
          }

          check_pr() {
            local pr="$1"
            local pr_json author head_ref head_sha is_draft
            local attempts checks_json check_count state current_head

            pr_json="$(gh pr view "$pr" --repo "$REPO" --json author,headRefName,headRefOid,isDraft)"
            author="$(jq -r '.author.login // ""' <<<"$pr_json")"
            head_ref="$(jq -r '.headRefName // ""' <<<"$pr_json")"
            head_sha="$(jq -r '.headRefOid // ""' <<<"$pr_json")"
            is_draft="$(jq -r '.isDraft' <<<"$pr_json")"

            if { [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot[bot]" ]; } ||
               [[ "$head_ref" != dependabot/* ]] || [ "$is_draft" = "true" ]; then
              echo "Skipping PR #$pr: not an eligible Dependabot PR."
              return 0
            fi

            attempts=1
            if [ "$EVENT_NAME" = "pull_request_target" ]; then
              attempts=60
            fi

            for _ in $(seq 1 "$attempts"); do
              checks_json="$(gh pr view "$pr" --repo "$REPO" --json statusCheckRollup --jq '
                [.statusCheckRollup[] |
                  select((.workflowName // "") != "Dependabot Automerge") |
                  select((.name // "") != "automerge")]
              ')"
              check_count="$(jq 'length' <<<"$checks_json")"

              if [ "$check_count" -eq 0 ]; then
                state=pending
              elif jq -e 'any(.[]; (.status != null and .status != "COMPLETED") or (.state != null and (.state == "PENDING" or .state == "EXPECTED")))' <<<"$checks_json" >/dev/null; then
                state=pending
              elif jq -e 'any(.[]; (.conclusion != null and (.conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != "NEUTRAL")) or (.state != null and .state != "SUCCESS"))' <<<"$checks_json" >/dev/null; then
                state=failed
              else
                state=passed
              fi

              case "$state" in
                passed)
                  current_head="$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
                  if [ "$current_head" != "$head_sha" ]; then
                    echo "PR #$pr changed while checks were running; waiting for the new run."
                    return 0
                  fi
                  gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$head_sha"
                  echo "Merged Dependabot PR #$pr after $check_count successful checks."
                  return 0
                  ;;
                failed)
                  echo "Leaving PR #$pr open: at least one check failed."
                  return 0
                  ;;
              esac

              sleep 15
            done

            echo "Leaving PR #$pr open: checks are missing or still pending."
          }

          prs_output="$(collect_prs)"
          if [ -z "$prs_output" ]; then
            echo "No open Dependabot PRs found."
            exit 0
          fi

          while IFS= read -r pr; do
            [ -n "$pr" ] && check_pr "$pr"
          done <<<"$prs_output"
