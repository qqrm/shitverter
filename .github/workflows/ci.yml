name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Check formatting, tests, and lints
        run: |
          cargo +stable fmt --check
          cargo +stable test --locked
          cargo +stable clippy --all-targets -- -D warnings

      - name: Audit dependencies
        run: |
          cargo +stable install cargo-audit --locked
          cargo +stable audit

      - name: Build production image
        run: |
          docker build --tag shitverter:ci .
          expected_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$(docker run --rm shitverter:ci --version)" = "converter-bot $expected_version"
