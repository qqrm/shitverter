name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
          fallback: none

      - name: Check formatting, tests, and lints
        run: |
          cargo +stable fmt --check
          cargo +stable nextest run --locked
          cargo +stable clippy --all-targets -- -D warnings

      - name: Install dependency tooling
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
            cargo-machete@0.9.2
          fallback: none

      - name: Audit dependencies
        run: cargo audit

      - name: Check dependency advisories and sources
        run: cargo deny check advisories bans sources

      - name: Check unused dependencies
        run: cargo machete

      - name: Build production image
        run: |
          docker build --tag shitverter:ci .
          expected_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$(docker run --rm shitverter:ci --version)" = "converter-bot $expected_version"

  ci-gate:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require conversion and dependency checks
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
