name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Build release image and extract worker
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          expected_tag="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$RELEASE_TAG" = "$expected_tag"

          image_name="shitverter-release:$GITHUB_SHA"
          container_name="shitverter-release-export"
          output="$RUNNER_TEMP/shitverter-serverless-linux-amd64"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            docker image rm --force "$image_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          docker build --tag "$image_name" .
          docker create --name "$container_name" "$image_name"
          docker cp "$container_name:/usr/local/bin/converter-bot" "$output"
          chmod 700 "$output"
          test "$("$output" --version)" = "converter-bot ${expected_tag#v}"
          (
            cd "$RUNNER_TEMP"
            sha256sum shitverter-serverless-linux-amd64 > shitverter-serverless-linux-amd64.sha256
          )

      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/shitverter-serverless-linux-amd64" \
            "$RUNNER_TEMP/shitverter-serverless-linux-amd64.sha256"
